[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetflow"
version = "1.0.0"
description = "SheetFlow — Excel-to-app migrator for small businesses: import your .xlsx/.csv process instead of changing it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SheetFlow contributors" }]
keywords = ["excel", "xlsx", "csv", "small-business", "kanban", "inventory", "fastapi", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sheetflow = "app.cli:main"

[project.urls]
Homepage = "https://github.com/<user>/sheetflow"
Changelog = "https://github.com/<user>/sheetflow/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]
